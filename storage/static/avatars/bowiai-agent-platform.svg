<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  role="img"
  aria-labelledby="bowi-agent-platform-title"
>
  <title id="bowi-agent-platform-title">Bowi AI Agent Platform</title>
  <defs>
    <linearGradient id="surface" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17134A"/>
      <stop offset="0.48" stop-color="#0B1230"/>
      <stop offset="1" stop-color="#071B2A"/>
    </linearGradient>
    <radialGradient id="atmosphere" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(33 31) rotate(90) scale(29)">
      <stop stop-color="#5B21B6" stop-opacity="0.56"/>
      <stop offset="0.52" stop-color="#312E81" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0B1029" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="13" y1="18" x2="52" y2="47" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.52" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="core" x1="25" y1="23" x2="42" y2="43" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.44" stop-color="#CFFAFE"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <filter id="core-glow" x="15" y="15" width="34" height="34" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#surface)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="#A5F3FC" stroke-opacity="0.14" stroke-width="1.5"/>
  <rect width="64" height="64" rx="16" fill="url(#atmosphere)"/>

  <g data-symbol="ai-aperture">
    <path
      d="M12.5 35.5C16 20.5 30.5 12 45.5 17.5C50.5 19.3 54.3 23.1 56 27.5"
      fill="none"
      stroke="url(#orbit)"
      stroke-width="2.25"
      stroke-linecap="round"
    />
    <path
      d="M51.5 24C48 39 33.5 47.5 18.5 42C13.5 40.2 9.7 36.4 8 32"
      fill="none"
      stroke="url(#orbit)"
      stroke-width="2.25"
      stroke-linecap="round"
      opacity="0.84"
    />

    <g data-part="orbit-node">
      <circle cx="13" cy="35" r="4.5" fill="#22D3EE" fill-opacity="0.16"/>
      <circle cx="13" cy="35" r="2.25" fill="#67E8F9"/>
      <circle cx="12.4" cy="34.4" r="0.7" fill="#FFFFFF"/>
    </g>
    <g data-part="orbit-node">
      <circle cx="46" cy="17.5" r="4.5" fill="#818CF8" fill-opacity="0.18"/>
      <circle cx="46" cy="17.5" r="2.25" fill="#A5B4FC"/>
      <circle cx="45.4" cy="16.9" r="0.7" fill="#FFFFFF"/>
    </g>
    <g data-part="orbit-node">
      <circle cx="51" cy="43" r="4.5" fill="#A855F7" fill-opacity="0.18"/>
      <circle cx="51" cy="43" r="2.25" fill="#C084FC"/>
      <circle cx="50.4" cy="42.4" r="0.7" fill="#FFFFFF"/>
    </g>

    <path
      d="M32 22.5C33.7 28.7 37.3 32.3 43.5 34C37.3 35.7 33.7 39.3 32 45.5C30.3 39.3 26.7 35.7 20.5 34C26.7 32.3 30.3 28.7 32 22.5Z"
      fill="#67E8F9"
      fill-opacity="0.54"
      filter="url(#core-glow)"
    />
    <path
      data-part="ai-core"
      d="M32 22.5C33.7 28.7 37.3 32.3 43.5 34C37.3 35.7 33.7 39.3 32 45.5C30.3 39.3 26.7 35.7 20.5 34C26.7 32.3 30.3 28.7 32 22.5Z"
      fill="url(#core)"
    />
    <path d="M32 28.5C32.8 31.3 34.7 33.2 37.5 34C34.7 34.8 32.8 36.7 32 39.5C31.2 36.7 29.3 34.8 26.5 34C29.3 33.2 31.2 31.3 32 28.5Z" fill="#FFFFFF"/>
  </g>
</svg>
